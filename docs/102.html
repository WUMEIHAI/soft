<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>快速修改或添加开机登入密码</title>
    <meta
      name="viewport"
      id="viewport"
      content="width=470,user-scalable=0, target-densitydpi=320"
    />
    <link rel="apple-touch-icon" href="images/logo.png" />
    <link rel="stylesheet" type="text/css" href="../css/zr.css" />
  </head>

  <body>
    <div class="doc-view">
      <div class="print-area">
        <h1 class="title-view long-break">
          1.02 计算机如何快速修改或添加开机登入密码
          <span title="原创文档" class="bg-sprites icon-original"></span>
        </h1>
        <div
          class="mce-content-body no-margin image-viewer no-user-select"
          style="position: relative"
        >
          <div
            class="lmxdzru7oh"
            style="
              width: 100%;
              height: 100%;
              position: absolute;
              z-index: 1;
              left: 0px;
              top: 0px;
              pointer-events: none;
              background-repeat: repeat;
              opacity: 0.1;
              background-size: auto;
              background-position: 130px 10px;
            "
          ></div>
          <ul>
            <li>
              待电脑桌面直接按键盘ctrl+alt+delete，出现以下界面：（以及wind
              10为例，xp不支持）<br />
            </li>
          </ul>

          <p>
            <img
              src="../images/zr/b435600ca54011eabd8c0a58ac131614.png"
              style="
                width: 519px;
                height: 464px;
                background-image: none;
                background-color: transparent;
              "
            />
          </p>

          <ul>
            <li>
              点击“更改密码”，出现修改密码的界面，第二行有密码的输入旧密码无密码的留空，三四行设置新密码（两遍），确定即可。
            </li>
          </ul>

          <p>
            <img
              src="../images/zr/2f89c856a54111eabe750a58ac131d06.png"
              alt=""
              style="
                width: 500px;
                height: 658px;
                background-image: none;
                background-color: transparent;
              "
            />
          </p>

          <ul>
            <li>确定完成开机密码的更改。</li>
          </ul>

          <div
            class="w3tsappue"
            style="
              width: 100%;
              height: 100%;
              position: absolute;
              z-index: 1;
              left: 0px;
              top: 0px;
              pointer-events: none;
              background-repeat: repeat;
              opacity: 0.1;
              background-size: auto;
            "
          ></div>
          <p>
            <img
              src="../images/zr/60262392a54111ea83320a58ac131156.png"
              style="width: 464px; height: 572px"
            />
          </p>
        </div>
      </div>
      <div class="mt-xl doc-meta clearfix">
        <span class="licence-warning secondary font-sm left">
          仅供内部学习与交流，未经公司授权切勿外传
        </span>
      </div>
    </div>
  </body>
</html>
